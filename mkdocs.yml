site_name: Unit Circle Inc
site_url: https://unitcircle.ca/mysite
#theme:
#  name: material
#  logo: logo.svg
#  palette:
#    primary: dark blue
theme:
  variant: modern
  name: material
  custom_dir: overrides            # holds .icons/brand/enso.svg
  favicon: assets/favicon.svg
  icon:
    logo: brand/enso               # inlined SVG, so it follows header colours
  font:
    text: Zen Kaku Gothic New
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/circle-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/circle
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

